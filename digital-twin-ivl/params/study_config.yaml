# Study configuration: design choices and modelling assumptions.
#
# Provenance rule:
#   * Literature-derived numbers are NOT typed here. They are referenced by
#     parameter name in params/literature_parameters.csv via `lit:` keys and
#     read by dtivl.params at run time.
#   * Numbers typed here are DESIGN DECISIONS (approved by the PI at a
#     checkpoint) or MODELLING ASSUMPTIONS. Each carries a `basis` string.
#   * Entries with status PENDING are placeholders awaiting a verified
#     literature value; the pipeline refuses to run the main analysis while
#     any entry used by it is PENDING (see dtivl.params.check_ready).

decisions:            # Checkpoint 1 answers (PI, 2026-10-11); Checkpoint 2 answers (PI, 2026-10-13)
  D1: "Test the 3D code on one 3D example with Fujino score 4 before the cohort run."
  D2: "Calcium thickness levels 0.2 and 0.4 mm."
  D3: "Calcium length levels (3D only) 1, 3, 5 mm."
  D4: "Morphologies: superficial sheet, deep sheet, calcified nodule (protruding), fragmented. Lipid and fibrous-cap variation only in the hold-out set."
  D5: "Calcium failure: primary strain-controlled (eps_f from Holzapfel 2004, sigma_c = E*eps_f); sensitivity stress-controlled (sigma_c = 179 kPa fixed)."
  D6: "Title: In Silico Digital Twins of Calcified Coronary Lesions under Intravascular Lithotripsy and Stenting."
  D7: "Network allow-list: not yet available (checked 2026-10-11)."
  D8: "Calcium modulus baseline 365 MPa (PI, 2026-10-13, Checkpoint 2 option c): calibrated to the model-internal surrogate 'IVL balloon alone does not fracture, IVL does'; the full modulus sweep, including the tissue-level 8.95 MPa, is reported as sensitivity analysis."
  D9: "Crack filler approved (degradation floor k = mu_fibrous/mu_calcium); sensitivity with k = k_residual (no filler) where the solver allows (PI, 2026-10-13)."
  D10: "Primary fracture outcomes: through-thickness damage yes/no and damage-onset pressure; damaged fraction secondary; crack number and pattern only if discrete cracks appear. Time-boxed test of a principal-strain (Rankine-type) damage driving force on the pilot lesions (PI, 2026-10-13)."
  D11: "Core thickness levels 0.2, 0.4 and 0.8 mm (+16 core lesions). The 0.8 mm level does not fit the reference plaque; plaque grown outward as needed (see geometry.calcium_iel_clearance_mm). Hold-out thickness range extended to 0.8 mm accordingly (PI, 2026-10-13; geometric handling proposed by the analyst)."
  D12: "3D length series 1/3/5 mm run in 3D only up to damage onset, on a subset chosen by the analyst and stated in the report (PI, 2026-10-13)."
  D13: "Erosion comparator kept on a subset (PI, 2026-10-13)."
  D14: "IVL represented by the single-pulse quasi-static peak equivalence; limitation stated (no pulse-count accumulation) (PI, 2026-10-13)."
  D15: "SECONDARY-status inputs approved as explicit exceptions (tissue densities for the transient IVL factor, physiological pressure), with a calcium-density sensitivity run (PI, 2026-10-13)."

design:
  seed: 20261009
  core_factorial:                 # 2D plane strain, fixed lumen/wall geometry
    arc_deg: [90, 180, 270, 360]  # user brief (Checkpoint 0)
    thickness_mm: [0.2, 0.4, 0.8] # D2 (0.2, 0.4) + D11 (0.8, Checkpoint 2)
    morphology: [superficial_sheet, deep_sheet, nodule, fragmented]   # D4
  lengths_3d_mm: [1, 3, 5]        # D3
  fujino4_example_3d:             # D1: one 3D test case with Fujino score 4
    basis: "Each D2/D3 series extended by one step so that every Fujino criterion is exceeded: arc 270 deg (>180), thickness 0.6 mm (>0.5), length 7 mm (>5)."
    arc_deg: 270
    thickness_mm: 0.6
    length_mm: 7
    morphology: superficial_sheet
  holdout_lhs:
    n: 24
    basis: "Latin hypercube (scipy.stats.qmc, seeded) over continuous ranges below; tests thresholds derived on the core set."
    ranges:
      arc_deg: [60, 360]                                   # user brief
      thickness_mm: [0.2, 0.8]                             # D2 lower bound, D11 upper bound (0.8 mm level)
      depth_mm: [{lit: calcium_depth_ex_vivo_FDOCT, transform: value-sd}, {lit: calcium_depth_ex_vivo_FDOCT, transform: value+sd}]
      depth_split: {lit: calcium_depth_ex_vivo_FDOCT}         # DESIGN: deep sheets sample [mean, mean+sd], other morphologies [mean-sd, mean]
      lumen_area_mm2: [{lit: pre_procedure_MLA_IVL_lesions, transform: value-sd}, {lit: pre_procedure_MLA_IVL_lesions, transform: value+sd}]
      ecc_index: [0.0, {expr: "1 - 1 / eccentric_plaque_threshold_max_over_min"}]   # (max-min)/max, eccentric limit
      lipid_fraction: 0.5                                  # DESIGN: half of the hold-out lesions carry a lipid pool
      lipid_arc_deg: [90, {lit: lipid_arc_high_risk_threshold}]   # 90 deg lower bound: ASSUMPTION (TCFA arc definitions not verified)
      cap_thickness_mm: [{lit: min_cap_thickness_OCT_culprit_AMI}, {lit: min_cap_thickness_OCT_culprit_SAP}]
      lipid_thickness_mm: {value: 0.2, basis: "ASSUMPTION: no verified lipid-core thickness found", status: ASSUMPTION}
      morphology: balanced_cycle                            # 6 lesions per morphology
      depth_rule: "if depth + thickness exceeds the local plaque thickness minus 0.05 mm, depth is reduced to fit (logged)"
      plaque_growth: outward                                # D11: if the calcium still does not fit at the lowest depth, the plaque grows outward by the deficit (eccentricity kept; logged)
  erosion_subset:                 # D13: erosion comparator on a core subset (full factorial of these levels)
    arc_deg: [180, 360]
    thickness_mm: [0.2, 0.8]
    morphology: [superficial_sheet, nodule]
    basis: "DESIGN: two arcs, the thinnest and thickest levels, a sheet and a nodule (8 core lesions)"
  length_series_3d:               # D12: src/drivers/stage_length3d.py (3D runs stop at damage onset)
    cross_sections: [C-A180-T0.4-SUP]
    h_axial_ca_mm: 0.5              # 2 quadratic layers over the shortest calcified length (1 mm); L = 5 mm: 10
    h_axial_margin_mm: 1.0          # calcium-free end blocks: as discretisation.example3d.h_axial_mm
    basis: "DESIGN (analyst choice under D12, 2026-10-14): core cross-sections at thickness 0.4 mm (the 3D in-plane calcium size, discretisation.example3d.h_calcium_mm = 0.15 mm, leaves fewer than 2 elements across 0.2 mm) whose 2D cohort run shows damage onset under IVL, so the onset load is defined in 2D; in-plane sizes as the D1 3D example; the 2D reference uses the same in-plane mesh; axial size 0.5 mm in the calcified block (P2 elements; with 0.25 mm the L = 5 mm model would have 24 axial layers against 7 in the D1 example, whose damage-onset run took 41 min; not affordable here with the direct solver)"
  field_lesions:                  # src/drivers/stage_fields.py: damage/displacement fields for figures only
    lesions: [C-A180-T0.2-SUP, C-A180-T0.2-DEEP, C-A180-T0.2-NOD, C-A180-T0.2-FRAG]
    basis: "DESIGN: one core lesion per morphology at the same arc (180 deg) and thickness (0.2 mm), so the damage patterns differ only by morphology; re-runs of the cohort protocols (IVL phase field, IVL erosion, post-IVL stent) that store fields"
  fig1_example_lesion: {value: C-A270-T0.4-SUP, basis: "DESIGN (analyst choice 2026-10-14, src/drivers/figs/fig1_design.py): example core lesion of the study-design figure, meshed and coloured by tissue (a superficial sheet of large arc at the middle thickness level, so lumen, calcium, fibrous intima and wall are all visible), and source of the lesion-specific IVL peak load p_top of the load-protocol panel (protocols.ivl.summary.p_top of its results/cohort_runs record). While that record has no IVL peak load (partial cohort), the first core lesion in cohort.csv order whose record has one is used, and the figure names it.", status: DESIGN}
  table1_parameters:              # src/drivers/table1_parameters.py
    value: {exclude: [materials.calcium.E_tissue_level, discretisation.h_axial_3d_mm, discretisation.example3d], stent_stiffness: results/calibration_stent.json}
    basis: "DESIGN (analyst choice 2026-10-14): Table 1 lists the inputs of the main (2D cohort) analysis: every entry of the geometry and loads sections, the material constants of MaterialSet.baseline(), the transient-model densities and sound speeds (SECONDARY, D15) and the pulse width, the fracture settings, the 2D discretisation, and the quantities the solver derives from them (crack-filler floor, regularisation length, onset energy density, Gc). Excluded: the tissue-level calcium modulus (sensitivity sweep only) and the 3D mesh sizes (3D example and length series, reported with them). The stent radial stiffness is the identified value of stent_stiffness (the config entry is its placeholder), as used by the cohort runs."
    status: DESIGN
  pilot_2d:                       # Checkpoint 2 pilot (3 lesions)
    - {arc_deg: 90,  thickness_mm: 0.2, morphology: superficial_sheet}
    - {arc_deg: 270, thickness_mm: 0.4, morphology: deep_sheet}
    - {arc_deg: 360, thickness_mm: 0.2, morphology: nodule}
  sensitivity:                    # src/drivers/stage_sensitivity.py (Checkpoint 2: D5, D9, D10, D15; study plan: Morris screening)
    status: DESIGN
    basis: "DESIGN: one-at-a-time scenarios (the 'sens' entries of this file, D5 stress-controlled failure) on the pilot lesions (design.pilot_2d); Morris elementary effects on four core lesions spanning the arc (90-360 deg), thickness (0.2-0.8 mm) and morphology levels of design.core_factorial (one lesion per morphology, none with a pilot geometry); r trajectories (SALib 1.6, Campolongo selection with local optimisation from a pool), seeded from design.seed + seed_offset"
    morris_lesions: [C-A90-T0.4-SUP, C-A180-T0.8-DEEP, C-A270-T0.2-NOD, C-A360-T0.4-FRAG]
    morris_trajectories: 6          # r; model runs = r (k + 1) x lesions (k = 8 inputs: 216 runs)
    morris_trajectory_pool: 40      # candidate trajectories for the optimal selection (null: plain Morris sampling)
    morris_levels: 4
    morris_conf_resamples: 1000     # bootstrap resamples of mu_star_conf
    morris_conf_level: 0.95
    seed_offset: 15                 # SALib seed (sampling and bootstrap) = design.seed + seed_offset
    sobol:                          # src/drivers/stage_sobol.py (study plan: Sobol indices for the linear predictors)
      status: DESIGN
      basis: "DESIGN: first-order and total Sobol indices (SALib 1.6: SALib.sample.sobol Saltelli cross-sampling and SALib.analyze.sobol, calc_second_order false) of every pre-treatment linear predictor (stage_cohort_runs.PREDICTOR_KEYS from dtivl.metrics.predictors.predictor_analysis, the cohort predictor load case) on the Morris lesions (design.sensitivity.morris_lesions), over the Morris inputs that enter the linear predictor analysis (inputs below) with their Morris ranges (stage_sensitivity.morris_inputs), each independent and uniform on its range (log10 scale for the calcium modulus and the foundation stiffness); everything else at the baseline (MaterialSet.baseline, as the cohort runs); each lesion meshed once and the mesh reused for every sample"
      inputs:                       # every input of stage_sensitivity.morris_inputs(): true = Sobol input, false = excluded (a decision per input is required)
        log10_ca_E: {value: true, basis: "DESIGN: included: the calcium modulus sets the calcium Lame constants of the linear solve (stress, strain and strain-energy predictors) and the stress threshold sigma_crit = E eps_f of frac_sig_gt_* (strain-controlled failure, D5)", status: DESIGN}
        eps_f: {value: true, basis: "DESIGN: included: the failure strain sets the thresholds of the threshold predictors frac_eps_gt_* (eps_f) and frac_sig_gt_* (sigma_crit = E eps_f); it does not enter the linear solve", status: DESIGN}
        log10_k_perivascular: {value: true, basis: "DESIGN: included: the perivascular foundation stiffness is the outer-boundary support of the linear solve (predictor_analysis k_found)", status: DESIGN}
        k_over_mu_soft: {value: true, basis: "DESIGN: included: K/mu sets the bulk moduli of the soft tissues (wall, fibrous, lipid) of the linear solve", status: DESIGN}
        fibrous_E: {value: true, basis: "DESIGN: included: the fibrous modulus sets the fibrous-tissue Lame constants of the linear solve", status: DESIGN}
        ivl_pulse_scale: {value: false, basis: "DESIGN: excluded: the IVL pulse amplitude enters run_ivl only (outcome model); the predictor load case is the static lumen pressure loads.ivl_balloon_pressure_atm", status: DESIGN}
        ell_over_h: {value: false, basis: "DESIGN: excluded: the phase-field length is an input of the nonlinear damage model; the averaging radius of the nonlocal predictors (*_nl) is part of their definition, fixed at the nominal fracture.ell_over_h x discretisation.h_calcium_mm (dtivl.metrics.predictors.nonlocal_radius), and is not varied", status: DESIGN}
        rho_calcium: {value: false, basis: "DESIGN: excluded: the calcium density enters the transient T_equivalent only (D15), an outcome-model input that is never a predictor; the predictor solve is static", status: DESIGN}
      n_base: {value: 512, basis: "DESIGN: Saltelli base sample size N, a power of 2 (balance of the Sobol sequence); N (k + 2) predictor analyses per lesion (calc_second_order false, k = inputs set true above) plus one baseline analysis; the largest power of 2 for which the Morris lesions fit budget_core_hours at planning_seconds_per_analysis (stage_sobol.planned_cost)", status: DESIGN}
      budget_core_hours: {value: 2, basis: "DESIGN: planned one-core wall time of the Sobol stage over the Morris lesions (a small share of the compute of the nonlinear cohort and sensitivity runs, which share the same cores); fixes n_base", status: DESIGN}
      planning_seconds_per_analysis: {value: 0.5, basis: "DESIGN: planning cost of one predictor_analysis call on a cohort mesh on one core (one linear-elastic solve plus the predictor post-processing; 0.2-1 s per call on the cohort meshes, depending on their size); the measured median and the projected one-core time are reported in results/sensitivity_sobol.json", status: DESIGN}
      scramble: {value: true, basis: "DESIGN: Owen-scrambled Sobol sequence (SALib default, scipy.stats.qmc.Sobol), seeded", status: DESIGN}
      seed_offset: {value: 16, basis: "DESIGN: scrambling and bootstrap seed = design.seed + seed_offset (a stage offset of its own, not the Morris design.sensitivity.seed_offset)", status: DESIGN}
      conf_resamples: {value: 1000, basis: "DESIGN: bootstrap resamples of S1_conf and ST_conf (SALib.analyze.sobol num_resamples), as for the Morris mu_star_conf", status: DESIGN}
      conf_level: {value: 0.95, basis: "DESIGN: confidence level of S1_conf and ST_conf (half-width of the normal bootstrap interval), as for the Morris mu_star_conf", status: DESIGN}
      tau_range_pct: {value: [5, 95], basis: "DESIGN: percentiles reported with the median of the per-sample Kendall tau between the lesions' baseline predictor values and their values at that sample (cross-lesion ranking stability under the material uncertainty)", status: DESIGN}
  composite_index_name: {value: LIFT, expansion: "Lithotripsy-Induced Fracture Tendency index", basis: "DESIGN (analyst proposal 2026-10-14; the PI may change it): name of the composite mechanics index of the metrics stage (metrics.composite). Alternatives considered: CaFI (Calcium Fracture Index), MCI (Mechanical Calcium Index).", status: DESIGN}

geometry:                         # fixed reference geometry of the core set
  lumen_area_mm2: {lit: pre_procedure_MLA_IVL_lesions}       # 2.2 mm^2 -> circular lumen
  stent_target_diameter_mm: {lit: stent_diameter_IVL_OCT}             # mean implanted stent diameter, IVL OCT cohort
  ivl_balloon_diameter_mm:  {lit: ivl_balloon_diameter_IVL_OCT}       # mean IVL balloon diameter, same cohort
  reference_diameter_mm:    {lit: reference_vessel_diameter_IVL_OCT}  # stent-expansion reference area
  # Intima/plaque thickness at the lesion: EEM radius taken as the reference lumen radius plus the
  # media (no remodelling, near-normal reference), so plaque = R_ref - r_lumen. Implied plaque burden
  # (~81%) is checked against CTA plaque burden of calcified plaques (77-85%) in the verification step.
  plaque_thickness_mm: {expr: "reference_vessel_diameter_IVL_OCT / 2 - sqrt(pre_procedure_MLA_IVL_lesions / pi)", basis: "DERIVED: R_ref - r_lumen (see comment)", status: DERIVED}
  wall_thickness_mm:   {expr: "media_thickness_main_branches + adventitia_thickness_atherosclerotic_LAD", basis: "DERIVED: media (histology median) + adventitia (IVUS, atherosclerotic LAD)", status: DERIVED}
  depth_superficial_mm: {lit: calcium_depth_ex_vivo_FDOCT, transform: value-sd}   # mean - 1 SD
  calcium_iel_clearance_mm: {value: 0.05, unit: mm, basis: "ASSUMPTION: minimum fibrous tissue between the calcium and the IEL (same 0.05 mm as the hold-out depth rule). D11: where depth + thickness + clearance exceeds the reference plaque thickness (0.8 mm level), the plaque grows outward (IEL and EEM radii increase, lumen unchanged).", status: ASSUMPTION}
  depth_deep_mm:        {lit: calcium_depth_ex_vivo_FDOCT, transform: value+sd}   # mean + 1 SD
  nodule_height_mm:     {value: 0.30, sens: [0.2, 0.4], basis: "ASSUMPTION: no verified OCT protrusion height found; set within the D2 thickness range", status: ASSUMPTION}
  nodule_base_arc_deg:  {value: 60, basis: "ASSUMPTION: nodule protrusion spans 60 deg at the centre of the calcium arc", status: ASSUMPTION}
  fragment_pitch_deg:   {value: 45, basis: "ASSUMPTION: one deposit per 45 deg of arc (n = arc/45, min 2)", status: ASSUMPTION}
  fragment_fill:        {value: 0.6, basis: "ASSUMPTION: each deposit fills 60% of its pitch", status: ASSUMPTION}
  margin_3d_mm:         {value: 2.0, basis: "ASSUMPTION: calcium-free segment length at each end of 3D models", status: ASSUMPTION}

discretisation:
  polar_n_theta: 360              # A-lines (1 deg), IVOCT-like polar map
  polar_dr_mm: 0.01               # 10 um radial sampling
  h_calcium_mm: 0.04              # coarse-mesh defaults (user request); convergence study refines/coarsens
  h_soft_mm: 0.15
  h_axial_3d_mm: 0.25
  example3d:                      # D1 3D code test: coarse for tractability with a direct solver (~64k tets, ~0.3M P2 dofs)
    h_calcium_mm: 0.15
    h_soft_mm: 0.4
    h_axial_mm: 1.0

materials:
  wall:
    model: yeoh
    c10: {lit: wall_yeoh_c10}
    c20: {lit: wall_yeoh_c20}
    c30: {lit: wall_yeoh_c30}
  fibrous:
    model: neo_hookean
    E: {lit: intima_hypocellular_tangential_modulus}
    sens_E: [{lit: intima_cellular_tangential_modulus}, {lit: intima_hypocellular_tangential_modulus, transform: value+sd}]
  lipid:
    model: neo_hookean
    E: {lit: lipid_modulus_AFM}
  calcium:
    model: compressible_neo_hookean
    E: {value: 365.006198, unit: MPa, basis: "CALIBRATED (D8, Checkpoint 2): point 6 of the 9 log-spaced pilot sweep points over sens_E (equality checked by tests/test_params_decisions.py); the stiffest tested modulus at which no pilot lesion fractures under the IVL balloon alone (4 atm) while IVL fractures them. Calibration to a model-internal surrogate, not to a published observation; at this modulus the 10-atm plain balloon still fractures 2 of 3 pilot lesions (cadaver contrast not met). Implied failure stress E*eps_f = 7.30 MPa vs measured tissue-level strength 0.179 MPa.", status: CALIBRATED}
    E_tissue_level: {expr: "calcification_fracture_stress / (calcification_fracture_stretch - 1)", basis: "DERIVED: secant modulus at failure of the same tissue (Holzapfel 2004); the pre-Checkpoint-2 baseline, kept in the sensitivity sweep", status: DERIVED}
    sens_E: [{lit: calcified_tissue_tangential_modulus}, {lit: calcification_modulus_nanoindentation, transform: lower}]
    nu: {lit: calcification_poisson_ratio}
  bulk_to_shear_soft: {value: 50, sens: [20, 200], basis: "ASSUMPTION: near-incompressibility penalty K/mu for soft tissues", status: ASSUMPTION}
  density:              # transient IVL subset only (model-input values from earlier studies; SECONDARY)
    wall:    {lit: density_arterial_wall_model_input, allow_status: [SECONDARY]}
    fibrous: {lit: density_arterial_wall_model_input, allow_status: [SECONDARY]}
    lipid:   {lit: density_plaque_model_input, allow_status: [SECONDARY]}
    calcium: {lit: density_calcified_plaque_model_input, allow_status: [SECONDARY],
              sens: [{lit: density_calcified_plaque_model_input, transform: alt, allow_status: [SECONDARY]}]}   # D15: calcium-density sensitivity with the other FE input value of the same row
  sound_speed_m_per_s:  # transient IVL subset only
    wall:    {lit: sound_speed_arterial_tissue_37C}
    fibrous: {lit: sound_speed_fibrous_plaque_37C}
    lipid:   {lit: sound_speed_fatty_material}
    calcium: {lit: sound_speed_highly_calcified_lesion_37C}

fracture:
  model: AT1
  split: volumetric_deviatoric
  eps_f: {expr: "calcification_fracture_stretch - 1", basis: "failure stretch 1.02 -> strain 0.02", status: DERIVED}
  sigma_c_stress_controlled: {lit: calcification_fracture_stress}
  ell_over_h: {value: 2.0, sens: [1.5, 3.0], basis: "ASSUMPTION: regularisation length = 2 calcium element sizes", status: ASSUMPTION}
  k_residual: 1.0e-4               # NUMERICAL: residual stiffness of fully damaged calcium; 1e-6 stalled Newton in stent contact (nonlinear module report); sensitivity 1e-5..1e-3
  d_crack: 0.9                    # cell-average d above which a cell is cracked (post-processing)
  crack_filler: {value: matrix, sens: [none], basis: "ASSUMPTION: a fully damaged calcium band keeps the small-strain shear modulus of the fibrous matrix around it (degradation floor k = mu_fibrous/mu_calcium, never below k_residual) instead of becoming a void; Gc is scaled by (1-k) so the AT1 onset criterion is unchanged. Added because brittle crack bands with k_residual alone left near-zero-shear bands between stiff calcium pieces and the displacement Newton solve failed (E_ca >= 121 MPa). 'none' uses k_residual only.", status: ASSUMPTION}
  driving_force: {value: energy, sens: [rankine], basis: "ASSUMPTION: force that drives damage in the AT1 damage sub-problem only (the displacement problem always uses g(d) psi+ + psi-). 'energy': the tensile energy psi+ of the volumetric-deviatoric split (formulation used up to Checkpoint 2). 'rankine' (D10, time-boxed test): hybrid formulation, psi_R = (E/2) <e1>+^2 with e1 the maximum principal Green-Lagrange strain (2D plane strain only), meant to open cracks perpendicular to the maximum principal strain; same AT1 calibration (onset at psi_R = psi_crit, i.e. e1 = eps_f in strain mode).", status: ASSUMPTION}

loads:
  physiological_pressure: {lit: normal_systolic_blood_pressure_upper, allow_status: [SECONDARY]}   # 120 mmHg (upper limit of normal systolic), in MPa; SECONDARY-status input under an explicit exception (Checkpoint 2, D15)
  ivl_balloon_pressure_atm: {lit: ivl_balloon_inflation_pressure}
  poba_pressure_atm: {lit: poba_pressure_cadaver_IVL_balloon}            # 10 atm plain balloon (no pulses), pilot comparison protocol, in MPa
  ivl_peak_pressure_MPa: {lit: ivl_peak_positive_pressure}
  ivl_pulse_scale: {value: 1.0, sens: [0.5, 1.0], basis: "ASSUMPTION: unknown attenuation between emitter and tissue", status: ASSUMPTION}
  balloon_rated_pressure_atm: {lit: stent_rated_burst_pressure}        # 16 atm, in MPa
  stent_radial_stiffness_MPa_per_mm: {value: 0.5, basis: "PLACEHOLDER until identified: chosen so that a calcium-free reference lesion shows the clinical acute recoil (lit acute_recoil_EES_CoCr_clinical); the identified value is written to results/calibration_stent.json", status: ASSUMPTION}
  stent_recoil_target_pct: {lit: acute_recoil_EES_CoCr_clinical}
  perivascular_k_MPa_per_mm: {value: 1.0e-4, sens: [1.0e-3, 1.0e-2, 1.0e-1], basis: "ASSUMPTION: negligible support; stabilises rigid-body modes only", status: ASSUMPTION}
  contact_penalty_MPa_per_mm: {value: 1.0e3, basis: "NUMERICAL: penalty stiffness; sensitivity in verification", status: NUMERICAL}
  malapposition_gap_mm: {value: 0.1, sens: [0.05, 0.2], basis: "ASSUMPTION: OCT malapposition distance threshold (not verified)", status: ASSUMPTION}

metrics:              # Phase 5 predictive metrics (src/stats/, src/drivers/stage_metrics.py). Analyst proposal 2026-10-14, status DESIGN until the PI confirms.
  bootstrap_n: {value: 2000, basis: "DESIGN: study plan (2000-sample bootstrap); percentile intervals", status: DESIGN}
  bootstrap_stratified: {value: true, basis: "DESIGN: binary outcomes are resampled within each outcome class, so every resample keeps the event and non-event counts of the set", status: DESIGN}
  seed_offset: {value: 500, basis: "DESIGN: rng entropy of the metrics stage = design.seed + seed_offset; each analysis draws from its own stream (numpy SeedSequence spawn key = CRC32 of the outcome/predictor/analysis key)", status: DESIGN}
  ci_level: {value: 0.95, basis: "DESIGN: two-sided 95 % intervals (percentile bootstrap; Wilson score intervals for sensitivity, specificity and accuracy)", status: DESIGN}
  min_per_class: {value: 2, basis: "DESIGN: a binary analysis of a set needs at least this many lesions in each outcome class; otherwise it is reported as not computed, with the reason", status: DESIGN}
  min_rows_continuous: {value: 5, basis: "DESIGN: minimum number of lesions with an outcome for a censored or continuous outcome analysis of a set", status: DESIGN}
  logistic_C: {value: 1.0, basis: "DESIGN: inverse L2 penalty strength of every logistic model (scikit-learn LogisticRegression, l1_ratio 0, lbfgs) on z-scored predictors; fixed a priori, not tuned", status: DESIGN}
  sets: {value: {derivation: core, test: holdout}, basis: "DESIGN: thresholds, directions, predictor selection and model fits use the core set only; the hold-out set is used only to evaluate them unchanged", status: DESIGN}
  candidates:
    value:
      mechanics: [pred_sigma1_p95, pred_sigma1_p99, pred_sigma1_mean, pred_sigma1_peak_nl, pred_sed_mean, pred_sed_peak_nl, pred_scf_edge_nl, pred_frac_eps_gt_epsf, pred_frac_eps_gt_half_epsf, pred_frac_sig_gt_sigc, pred_frac_sig_gt_half_sigc, pred_min_thickness_high_stress]
      geometry: [ca_arc_total_deg, ca_thickness_max, ca_depth, ca_area, n_deposits, lumen_area, lipid_arc_deg, plaque_ecc_index]
      comparator: [fujino_score]
    basis: "DESIGN: mechanics = pre-treatment linear-analysis predictors (results 'predictors' block, pred_* columns; pred_p_lumen_MPa and pred_seconds are the load and the run time, not predictors); geometry = cohort descriptors; comparator = cross-sectional Fujino score (max 3 in 2D). Outcomes come only from the nonlinear damage runs."
    status: DESIGN
  forbidden_predictor_prefixes: {value: [ivl_load_], basis: "DESIGN: the IVL load factor (ivl_load_* columns: T, T_equivalent and the transient records) is an input of the outcome model and is refused as a predictor; outcome columns (<protocol>_*) are refused as well", status: DESIGN}
  direction:
    value:
      default: 1
      overrides: {pred_min_thickness_high_stress: -1, ca_thickness_max: -1, ca_depth: -1, ca_area: core, n_deposits: core, lumen_area: core, lipid_arc_deg: core, plaque_ecc_index: core}
    basis: "DESIGN: expected sign of the association with damage (+1: a higher value predicts damage and an earlier onset; -1: a lower value does). Stress, energy, area-fraction and edge-concentration predictors, the calcium arc and the Fujino score (higher = more severe calcification) +1; thinner calcium where the stress is high, thinner and more superficial calcium -1. 'core': no sign stated a priori; set on the core set as the sign giving AUC >= 0.5 (reported per predictor as direction_source 'core'; optimistic; univariable analyses: re-derived inside each LOOCV fold, kept fixed in the bootstrap; composite selection: re-derived on the training rows of every fold and resample). The directions apply to the damage outcomes (fracture yes/no, damage-onset load); stent expansion has no a priori direction (metrics.outcomes)."
    status: DESIGN
  outcomes:
    value:
      - {name: ivl_fracture, role: primary, kind: binary, column: ivl_fracture, protocol: ivl, ok_status: [ok], models: true}
      - {name: ivl_onset, role: secondary, kind: censored, column: ivl_onset, event: onset_recorded, fracture_column: ivl_fracture, protocol: ivl, ok_status: [ok], censor: ivl_peak_pressure}
      - {name: balloon_only_fracture, role: secondary, kind: binary, column: balloon_only_fracture, protocol: balloon_only, ok_status: [ok], models: false}
      - {name: balloon_10atm_fracture, role: secondary, kind: binary, column: balloon_10atm_fracture, protocol: balloon_10atm, ok_status: [ok], models: false}
      - {name: ivl_erosion_fracture, role: secondary, kind: binary, column: ivl_erosion_fracture, protocol: ivl_erosion, ok_status: [ok], models: false}
      - {name: stent_post_ivl_expansion, role: secondary, kind: continuous, column: stent_post_ivl_stent_expansion_pct, protocol: stent_post_ivl, ok_status: [ok, limited]}
      - {name: stent_no_ivl_expansion, role: secondary, kind: continuous, column: stent_no_ivl_stent_expansion_pct, protocol: stent_no_ivl, ok_status: [ok, limited]}
    basis: "DESIGN: D10 primary outcome = through-thickness damage under IVL (rows with ivl_status ok). Secondary: IVL damage-onset load (D10 'damage-onset pressure': lumen pressure, MPa, at the first load step with max d >= fracture.d_crack in the calcium, a local criterion; event: onset_recorded = the onset load is recorded, value = that load, so a partial crack without through-thickness damage is an event; otherwise right-censored at the lesion's own peak IVL pressure ivl_p_top as stored by its IVL run, the largest load the lesion saw, checked against p_bal + T_equivalent x ivl_peak_pressure_MPa x ivl_pulse_scale and recomputed from these only where ivl_p_top is absent; T enters only this censoring value, never a predictor; fracture_column is read only to count onset rows without through-thickness damage, which stay events), fracture under the 4 atm IVL balloon alone and under the 10 atm plain balloon, stent expansion with and without prior IVL (status 'limited' = pressure-limited expansion, kept; 'failed' runs excluded; no direction stated a priori, so these concordance analyses are exploratory: C of the raw predictor, its observed sign and max(C, 1 - C)). Logistic models (composite, incremental value) only where models is true. Amended 2026-10-14 after code review: the event was through-thickness damage while the value was the local onset load (two definitions); stent expansion had reused the damage directions of metrics.direction. Cross-model check (added 2026-10-14, before its result was seen): through-thickness fracture under IVL from the erosion comparator (D13, design.erosion_subset), a fracture model separate from the phase field, scored with the same pre-treatment predictors (univariable analyses only; few lesions, so interpret as a robustness check)."
    status: DESIGN
  composite:
    value: {pool: [mechanics], max_predictors: 3, max_abs_spearman: 0.8, min_discrimination: 0.6}
    basis: "DESIGN (rule drafted 2026-10-14 by the analyst; a smoke run on the preliminary core rows available during implementation was made; amended 2026-10-14 after code review to rank by the oriented AUC so the a priori directions of metrics.direction are respected; to be confirmed by the PI): candidates = the pool predictors without missing or constant values on the training rows and with an oriented univariable AUC >= min_discrimination on the training rows (the AUC of direction x value with the direction of metrics.direction; 'core' directions are set on the training rows of every fold or resample, i.e. max(AUC, 1 - AUC)), so that the model is not filled with uninformative predictors and a predictor associated with the opposite of its a priori sign cannot enter; ranked by that oriented AUC (ties: list order); taken in rank order, skipping any candidate with |Spearman rho| > max_abs_spearman against one already chosen, up to max_predictors (study plan: <= 3; fewer if the candidates run out); L2-penalised logistic regression (logistic_C) on the z-scored selected predictors; the index is the model log-odds; selected predictors whose fitted coefficient sign opposes their direction are reported. The training rows are the core set; the rule is re-applied inside every LOOCV fold and bootstrap resample, and the hold-out set is never used for a choice."
    status: DESIGN
  incremental:
    value: {geometry_model: [ca_arc_total_deg, ca_thickness_max, ca_depth, n_deposits], mechanics_pool: [mechanics]}
    basis: "DESIGN: geometry-only model = penalised logistic regression on the descriptors of the core design factors (arc, thickness, depth, deposit count); geometry + mechanics model = the same descriptors plus the mechanics predictors chosen by the composite rule. Compared by apparent AUC (paired bootstrap with both models refitted in every resample), LOOCV AUC, log-loss and Brier score (paired bootstrap of the out-of-fold predictions) and on the hold-out set (paired bootstrap of the hold-out rows)."
    status: DESIGN

consistency:          # src/drivers/stage_consistency.py: simulated outcomes next to published observations (checks C1-C12). Analyst proposal 2026-10-14, status DESIGN until the PI confirms. Agreement means consistency with a published observation, never a test against patient outcomes.
  seed_offset: {value: 600, basis: "DESIGN: rng entropy of the consistency stage = design.seed + seed_offset (an offset of its own, distinct from metrics.seed_offset); every bootstrap interval draws from its own stream (dtivl.stats.roc.rng_for, spawn key = CRC32 of 'check|quantity|set'). Bootstrap size, stratification of binary outcomes and interval level are those of the metrics stage (metrics.bootstrap_n, metrics.bootstrap_stratified, metrics.ci_level)", status: DESIGN}
  sets: {value: [core, holdout], basis: "DESIGN: every lesion-level check is computed on the core set (the designed factorial) and, in a separate row, on the hold-out set (Latin hypercube); the sets are never pooled. Youden cuts are derived on the core set only (as metrics.sets). The cohort geometry check (C12) is one cohort-level row", status: DESIGN}
  ok_status: {value: {default: [ok], stent_no_ivl: [ok, limited], stent_post_ivl: [ok, limited]}, basis: "DESIGN: protocol runs a check uses, as metrics.outcomes: fracture outcomes from runs with status ok; stent outcomes also from pressure-limited runs (status limited); failed and missing runs are excluded and counted in the row note", status: DESIGN}
  allow_status: {value: [SECONDARY], basis: "DESIGN: a comparison-only literature row of status SECONDARY (value quoted in later reviews, not seen in the primary source) may be shown next to the model, with its status in the row (C2 thickness cutoff); UNVERIFIED rows are never read", status: DESIGN}
  min_n: {value: 5, basis: "DESIGN: minimum number of lesions with the model quantity for a check of one set (proportion, distribution or correlation); with fewer the check is not computed and the reason is given (as metrics.min_rows_continuous)", status: DESIGN}
  min_per_group: {value: 2, basis: "DESIGN: odds ratio (C3) and Youden cut (C1, C2) need at least this many lesions in each morphology group or outcome class (as metrics.min_per_class)", status: DESIGN}
  direction_rule: {value: {require_ci: true}, basis: "DESIGN: a direction check (Spearman rho against 0, odds ratio against 1) agrees when the point estimate lies on the expected side of the null value and its interval (metrics.ci_level) excludes the null value; partial when only the point estimate does; disagrees otherwise (including a point estimate equal to the null value). A check over several protocols agrees if every computed protocol agrees, disagrees if every one disagrees, and is partial otherwise", status: DESIGN}
  odds_ratio: {value: {correction: 0.5}, basis: "DESIGN: Haldane-Anscombe correction, 0.5 added to every cell of the 2x2 table whether or not a cell is empty (one estimator in every data state), Woolf (log) interval at metrics.ci_level", status: DESIGN}
  checks:
    C1:
      value:
        kind: published_observation
        observation: "larger calcium arc, more calcium fracture (plain balloon angioplasty, OCT; published arc cutoff)"
        column: ca_arc_total_deg
        expected_sign: 1
        protocols: [balloon_10atm, ivl]
        youden_protocol: balloon_10atm
        published: [fracture_angle_cutoff_balloon]
      basis: "DESIGN: direction of the published plain-balloon predictor: Spearman rho of the total calcium arc (cohort descriptor) and the through-thickness fracture indicator under the plain balloon (protocol balloon_10atm, load loads.poba_pressure_atm) and under IVL, per consistency.direction_rule. The core Youden cut of the arc for plain-balloon fracture (dtivl.stats.roc, direction +1) is shown next to the published cutoff, descriptively; it is not part of the agreement (the core arc takes a few design levels)"
      status: DESIGN
    C2:
      value:
        kind: published_observation
        observation: "thinner calcium, more calcium fracture (plain balloon angioplasty, OCT; published thickness cutoff)"
        column: ca_thickness_max
        expected_sign: -1
        protocols: [balloon_10atm, ivl]
        youden_protocol: balloon_10atm
        published: [fracture_thickness_cutoff_balloon]
      basis: "DESIGN: as C1 for the maximum calcium thickness (cohort descriptor ca_thickness_max; the descriptor behind the published cutoff is not stated in the parameter row), expected sign -1; the core Youden cut (direction -1) is descriptive"
      status: DESIGN
    C3:
      value:
        kind: published_observation
        observation: "calcified nodules fracture less often than sheet calcium under IVL (OCT)"
        protocol: ivl
        exposed: [nodule]
        reference: [superficial_sheet, deep_sheet]
        expected_sign: -1
        published: [nodular_calcium_odds_ratio_for_fracture, fracture_rate_calcified_nodule_sites_IVL]
      basis: "DESIGN: odds ratio of IVL fracture, nodule lesions vs sheet lesions (superficial + deep; fragmented lesions are in neither group), consistency.odds_ratio; agrees per consistency.direction_rule with an odds ratio below 1. The nodule fracture proportion (Wilson interval) is shown next to the published nodule-site rate, descriptively"
      status: DESIGN
    C4:
      value:
        kind: published_observation
        observation: "lesion-level calcium fracture rate after IVL (OCT, Disrupt CAD trials)"
        protocol: ivl
        rule: band_or_ci_overlap
        published: [fracture_rate_DisruptCAD_III_OCT, fracture_rate_DisruptCAD_II_OCT]
        caveat: "Neither set is a clinical case mix: the core set is a designed factorial of arc, thickness and morphology and the hold-out set a Latin hypercube over the same ranges, so the model fracture proportion follows from the design. OCT misses part of the calcium fractures (context row: an ex vivo study of laser, not electrohydraulic, IVL), whereas the model registers every through-thickness damage band of its cross-section."
        context_rows: [{row: laser_IVL_OCT_modification_rate, cell: range}]
      basis: "DESIGN: model IVL fracture proportion with a Wilson interval; agrees if the proportion lies within the range spanned by the published rates or its interval overlaps that range, disagrees otherwise (the row note says which condition held). The caveat and its context literature row (verbatim cell, not compared) are copied into the row note"
      status: DESIGN
    C5:
      value:
        kind: published_observation
        observation: "a plain balloon (IVL catheter balloon inflated without lithotripsy pulses) does not fracture calcium (human cadaver coronary lesions, histology)"
        protocol: balloon_10atm
        rule: zero
        decision: D8
        published: [calcium_fracture_rate_POBA_10atm_cadaver_histology]
      basis: "DESIGN: agrees only if no lesion fractures under the plain balloon (load loads.poba_pressure_atm, the inflation pressure of the same cadaver study), the published proportion being zero, disagrees otherwise; disagreement is expected at the calibrated calcium modulus (decision D8, materials.calcium.E)"
      status: DESIGN
    C6:
      value:
        kind: model_internal
        observation: "the IVL balloon inflated alone (no pulses) does not fracture calcium; model-internal surrogate of decision D8, calibrated on the pilot lesions only, not a published observation"
        protocol: balloon_only
        rule: zero
        decision: D8
        published: []
      basis: "DESIGN: the D8 calibration surrogate applied to the cohort lesions, which were not used for the calibration; agrees only if no lesion fractures under the IVL balloon alone"
      status: DESIGN
    C7:
      value:
        kind: published_observation
        observation: "stent expansion after IVL (OCT, Disrupt CAD III)"
        protocol: stent_post_ivl
        column: stent_expansion_pct
        rule: mean_within_sd
        published: [stent_expansion_maxCa_site_DisruptCAD_III, stent_expansion_MSA_site_DisruptCAD_III]
        site: "Model expansion (dtivl.metrics.outcomes.stent_metrics, run by dtivl.solvers.nonlinear.run_stent): stent area after recoil of the single modelled cross-section, msa = pi R_final^2 of the rigid cylinder (the in-stent minimum lumen area of that section), divided by one reference lumen area pi (D_ref/2)^2 with D_ref = geometry.reference_diameter_mm (cohort mean reference lumen diameter, not lesion-specific proximal and distal reference segments). The modelled section is the calcium site by construction (maximum-calcium-site definition) and, being the only section, also the minimum-stent-area section of the modelled segment (MSA-site definition), so both published definitions are shown."
      basis: "DESIGN: agrees if the model mean lies within published mean +/- 1 SD for every published site definition, partial if for some, disagrees if for none; the row note states the model definition and the expansion cap set by the deployment target (geometry.stent_target_diameter_mm vs geometry.reference_diameter_mm)"
      status: DESIGN
    C8:
      value:
        kind: calibration_target
        observation: "acute stent recoil (clinical QCA, cobalt-chromium everolimus-eluting stent)"
        protocols: [stent_no_ivl, stent_post_ivl]
        column: acute_recoil_pct
        rule: mean_within_sd
        published: [acute_recoil_EES_CoCr_clinical]
      basis: "DESIGN: calibration target, not an independent check: the stent radial stiffness (results/calibration_stent.json) was identified so that a calcium-free lesion shows the published recoil; the cohort recoil is reported per stent protocol against published mean +/- 1 SD (agrees if every protocol mean lies inside, partial if some, disagrees if none)"
      status: DESIGN
    C9:
      value:
        kind: model_vs_model
        observation: "calcium stress magnitude under post-dilation balloon loading in an earlier FE study (in silico)"
        columns: [pred_sigma1_p99, pred_sigma1_peak_nl]
        load_column: pred_p_lumen_MPa
        target_load: loads.poba_pressure_atm
        factor: 3
        published: [insilico_postdilation_calcium_stress]
      basis: "DESIGN: the pre-treatment linear-elastic predictor stresses scaled from their load (pred_p_lumen_MPa) to the study's plain-balloon load (loads.poba_pressure_atm, the load of the published value, converted to MPa by dtivl.params); exact for the linear model. Agrees if the cohort median of every scaled stress lies within a factor 'factor' of the published value, partial if some, disagrees if none; not computed while the published row has no plain-number value"
      status: DESIGN
    C10:
      value:
        kind: published_observation
        observation: "number of fractures per lesion and fraction of full-thickness fractures after IVL (pooled OCT analysis)"
        protocol: ivl
        count: {published: fractures_per_lesion_pooled_IVL_OCT, rule: mean_within_sd}
        fraction: {published: full_thickness_fracture_fraction_pooled_IVL_OCT, rule: published_in_ci}
        published: [fractures_per_lesion_pooled_IVL_OCT, full_thickness_fracture_fraction_pooled_IVL_OCT]
      basis: "DESIGN: count = ivl_n_fractures over the lesions with IVL fracture (agrees if the mean lies within published mean +/- 1 SD); full-thickness fraction = sum n_fractures / sum (n_fractures + n_partial) over the IVL lesions with any crack component, percentile interval from a lesion-level bootstrap (fractures are nested in lesions; agrees if the published fraction lies inside). Both agree: agrees; one: partial; none: disagrees. Diffuse damage (ivl_diffuse) counts as one through-thickness fracture, as in dtivl.fracture.cracks"
      status: DESIGN
    C11:
      value:
        kind: published_observation
        observation: "higher OCT calcium (Fujino) score, lower stent expansion"
        column: fujino_score
        protocol: stent_no_ivl
        outcome: stent_expansion_pct
        expected_sign: -1
        published: [fujino_score4_stent_expansion]
      basis: "DESIGN: direction only: Spearman rho of the cross-sectional Fujino score and stent expansion without IVL, expected sign -1, per consistency.direction_rule; the published top-score group needs the calcium length criterion and does not exist in 2D"
      status: DESIGN
    C12:
      value:
        kind: geometry_plausibility
        observation: "implied plaque burden of the constructed lesions vs CTA plaque burden of calcified plaques and calcified nodules"
        source: cohort_summary
        published: [plaque_burden_calcified_plaque_CTA, plaque_burden_calcified_nodule_CTA]
      basis: "DESIGN: values copied from results/cohort_summary.json (plaque_burden_check, plaque_growth), not recomputed: agrees if the reference geometry lies within the CTA range and no grown lesion (D11) exceeds the nodule value, partial if the reference lies within the range but some grown lesions exceed it, disagrees if the reference lies outside; not computed if the CTA values stored there differ from the literature table. One cohort-level row; n lesions = the consistency.sets entries of n_per_set"
      status: DESIGN
figures:              # manuscript figures (src/drivers/figs/): presentation choices only, never model inputs (analyst proposal 2026-10-14)
  fig4_damage_fields:
    orientation_deg: {value: 90, unit: deg, basis: "DESIGN: each panel is rotated rigidly about the lumen centre so that the area-weighted centroid of the lesion's calcium cells (reference configuration) lies at this polar angle (90 deg: 12 o'clock); display only, the same rotation for the three panels of a lesion", status: DESIGN}
    zoom_margin_frac: {value: 0.08, basis: "DESIGN: one window for every panel: the bounding box of the calcium nodes of all available panels (rotated final configurations, points + u) widened on each side by this fraction of its larger side, so that all panels share one scale", status: DESIGN}
    scale_bar_frac: {value: 0.25, basis: "DESIGN: scale-bar length = the largest 1, 2 or 5 x 10^k mm not exceeding this fraction of the window width", status: DESIGN}
  fig5_outcomes:
    set: {value: core, basis: "DESIGN: the outcome maps, stent-expansion and onset panels show the core factorial (levels from design.core_factorial, outcomes from results/cohort_outcomes.csv)", status: DESIGN}
    map_protocols: {value: [balloon_only, balloon_10atm, ivl], basis: "DESIGN: outcome maps of the three damage protocols run on every core lesion (stage_cohort_runs.COHORT_PROTOCOLS): the IVL balloon alone (loads.ivl_balloon_pressure_atm), the plain balloon (loads.poba_pressure_atm) and IVL", status: DESIGN}
    onset_evidence: {value: [onset, n_partial, max_depth_frac, damaged_fraction], basis: "DESIGN: damage class of a lesion under a protocol. 'not run / failed': no record, or a status outside that protocol's ok_status in metrics.outcomes (default [ok]); 'through-thickness': <protocol>_fracture true; 'partial': no through-thickness damage but damage onset present, i.e. any available column of <protocol>_onset recorded (first load with max d >= fracture.d_crack, the ivl_onset event of metrics.outcomes), <protocol>_n_partial > 0, <protocol>_max_depth_frac > 0 or <protocol>_damaged_fraction > 0; 'no damage onset': none of these", status: DESIGN}
    expansion_reference: {value: stent_target, basis: "DESIGN: reference line of the stent-expansion panel at the expansion of a stent deployed exactly at its target diameter, before recoil: 100 (D_stent / D_ref)^2 with geometry.stent_target_diameter_mm and geometry.reference_diameter_mm (definition of stent_expansion_pct in src/metrics/outcomes.py; the stent protocol expands to this radius). Not a clinical criterion. 'none': no line", status: DESIGN}
    dodge_frac: {value: 0.22, basis: "DESIGN: onset panel: the points of the thickness levels at one calcium arc are spread horizontally by this fraction of the smallest spacing of the arc levels (display only; the arc axis keeps the design levels as ticks)", status: DESIGN}
