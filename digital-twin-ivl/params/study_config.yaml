# Study configuration: design choices and modelling assumptions.
#
# Provenance rule:
#   * Literature-derived numbers are NOT typed here. They are referenced by
#     parameter name in params/literature_parameters.csv via `lit:` keys and
#     read by dtivl.params at run time.
#   * Numbers typed here are DESIGN DECISIONS (approved by the PI at a
#     checkpoint) or MODELLING ASSUMPTIONS. Each carries a `basis` string.
#   * Entries with status PENDING are placeholders awaiting a verified
#     literature value; the pipeline refuses to run the main analysis while
#     any entry used by it is PENDING (see dtivl.params.check_ready).

decisions:            # Checkpoint 1 answers (PI, 2026-10-11); Checkpoint 2 answers (PI, 2026-10-13)
  D1: "Test the 3D code on one 3D example with Fujino score 4 before the cohort run."
  D2: "Calcium thickness levels 0.2 and 0.4 mm."
  D3: "Calcium length levels (3D only) 1, 3, 5 mm."
  D4: "Morphologies: superficial sheet, deep sheet, calcified nodule (protruding), fragmented. Lipid and fibrous-cap variation only in the hold-out set."
  D5: "Calcium failure: primary strain-controlled (eps_f from Holzapfel 2004, sigma_c = E*eps_f); sensitivity stress-controlled (sigma_c = 179 kPa fixed)."
  D6: "Title: In Silico Digital Twins of Calcified Coronary Lesions under Intravascular Lithotripsy and Stenting."
  D7: "Network allow-list: not yet available (checked 2026-10-11)."
  D8: "Calcium modulus baseline 365 MPa (PI, 2026-10-13, Checkpoint 2 option c): calibrated to the model-internal surrogate 'IVL balloon alone does not fracture, IVL does'; the full modulus sweep, including the tissue-level 8.95 MPa, is reported as sensitivity analysis."
  D9: "Crack filler approved (degradation floor k = mu_fibrous/mu_calcium); sensitivity with k = k_residual (no filler) where the solver allows (PI, 2026-10-13)."
  D10: "Primary fracture outcomes: through-thickness damage yes/no and damage-onset pressure; damaged fraction secondary; crack number and pattern only if discrete cracks appear. Time-boxed test of a principal-strain (Rankine-type) damage driving force on the pilot lesions (PI, 2026-10-13)."
  D11: "Core thickness levels 0.2, 0.4 and 0.8 mm (+16 core lesions). The 0.8 mm level does not fit the reference plaque; plaque grown outward as needed (see geometry.calcium_iel_clearance_mm). Hold-out thickness range extended to 0.8 mm accordingly (PI, 2026-10-13; geometric handling proposed by the analyst)."
  D12: "3D length series 1/3/5 mm run in 3D only up to damage onset, on a subset chosen by the analyst and stated in the report (PI, 2026-10-13)."
  D13: "Erosion comparator kept on a subset (PI, 2026-10-13)."
  D14: "IVL represented by the single-pulse quasi-static peak equivalence; limitation stated (no pulse-count accumulation) (PI, 2026-10-13)."
  D15: "SECONDARY-status inputs approved as explicit exceptions (tissue densities for the transient IVL factor, physiological pressure), with a calcium-density sensitivity run (PI, 2026-10-13)."

design:
  seed: 20261009
  core_factorial:                 # 2D plane strain, fixed lumen/wall geometry
    arc_deg: [90, 180, 270, 360]  # user brief (Checkpoint 0)
    thickness_mm: [0.2, 0.4, 0.8] # D2 (0.2, 0.4) + D11 (0.8, Checkpoint 2)
    morphology: [superficial_sheet, deep_sheet, nodule, fragmented]   # D4
  lengths_3d_mm: [1, 3, 5]        # D3
  fujino4_example_3d:             # D1: one 3D test case with Fujino score 4
    basis: "Each D2/D3 series extended by one step so that every Fujino criterion is exceeded: arc 270 deg (>180), thickness 0.6 mm (>0.5), length 7 mm (>5)."
    arc_deg: 270
    thickness_mm: 0.6
    length_mm: 7
    morphology: superficial_sheet
  holdout_lhs:
    n: 24
    basis: "Latin hypercube (scipy.stats.qmc, seeded) over continuous ranges below; tests thresholds derived on the core set."
    ranges:
      arc_deg: [60, 360]                                   # user brief
      thickness_mm: [0.2, 0.8]                             # D2 lower bound, D11 upper bound (0.8 mm level)
      depth_mm: [{lit: calcium_depth_ex_vivo_FDOCT, transform: value-sd}, {lit: calcium_depth_ex_vivo_FDOCT, transform: value+sd}]
      depth_split: {lit: calcium_depth_ex_vivo_FDOCT}         # DESIGN: deep sheets sample [mean, mean+sd], other morphologies [mean-sd, mean]
      lumen_area_mm2: [{lit: pre_procedure_MLA_IVL_lesions, transform: value-sd}, {lit: pre_procedure_MLA_IVL_lesions, transform: value+sd}]
      ecc_index: [0.0, {expr: "1 - 1 / eccentric_plaque_threshold_max_over_min"}]   # (max-min)/max, eccentric limit
      lipid_fraction: 0.5                                  # DESIGN: half of the hold-out lesions carry a lipid pool
      lipid_arc_deg: [90, {lit: lipid_arc_high_risk_threshold}]   # 90 deg lower bound: ASSUMPTION (TCFA arc definitions not verified)
      cap_thickness_mm: [{lit: min_cap_thickness_OCT_culprit_AMI}, {lit: min_cap_thickness_OCT_culprit_SAP}]
      lipid_thickness_mm: {value: 0.2, basis: "ASSUMPTION: no verified lipid-core thickness found", status: ASSUMPTION}
      morphology: balanced_cycle                            # 6 lesions per morphology
      depth_rule: "if depth + thickness exceeds the local plaque thickness minus 0.05 mm, depth is reduced to fit (logged)"
      plaque_growth: outward                                # D11: if the calcium still does not fit at the lowest depth, the plaque grows outward by the deficit (eccentricity kept; logged)
  pilot_2d:                       # Checkpoint 2 pilot (3 lesions)
    - {arc_deg: 90,  thickness_mm: 0.2, morphology: superficial_sheet}
    - {arc_deg: 270, thickness_mm: 0.4, morphology: deep_sheet}
    - {arc_deg: 360, thickness_mm: 0.2, morphology: nodule}

geometry:                         # fixed reference geometry of the core set
  lumen_area_mm2: {lit: pre_procedure_MLA_IVL_lesions}       # 2.2 mm^2 -> circular lumen
  stent_target_diameter_mm: {lit: stent_diameter_IVL_OCT}             # mean implanted stent diameter, IVL OCT cohort
  ivl_balloon_diameter_mm:  {lit: ivl_balloon_diameter_IVL_OCT}       # mean IVL balloon diameter, same cohort
  reference_diameter_mm:    {lit: reference_vessel_diameter_IVL_OCT}  # stent-expansion reference area
  # Intima/plaque thickness at the lesion: EEM radius taken as the reference lumen radius plus the
  # media (no remodelling, near-normal reference), so plaque = R_ref - r_lumen. Implied plaque burden
  # (~81%) is checked against CTA plaque burden of calcified plaques (77-85%) in the verification step.
  plaque_thickness_mm: {expr: "reference_vessel_diameter_IVL_OCT / 2 - sqrt(pre_procedure_MLA_IVL_lesions / pi)", basis: "DERIVED: R_ref - r_lumen (see comment)", status: DERIVED}
  wall_thickness_mm:   {expr: "media_thickness_main_branches + adventitia_thickness_atherosclerotic_LAD", basis: "DERIVED: media (histology median) + adventitia (IVUS, atherosclerotic LAD)", status: DERIVED}
  depth_superficial_mm: {lit: calcium_depth_ex_vivo_FDOCT, transform: value-sd}   # mean - 1 SD
  calcium_iel_clearance_mm: {value: 0.05, unit: mm, basis: "ASSUMPTION: minimum fibrous tissue between the calcium and the IEL (same 0.05 mm as the hold-out depth rule). D11: where depth + thickness + clearance exceeds the reference plaque thickness (0.8 mm level), the plaque grows outward (IEL and EEM radii increase, lumen unchanged).", status: ASSUMPTION}
  depth_deep_mm:        {lit: calcium_depth_ex_vivo_FDOCT, transform: value+sd}   # mean + 1 SD
  nodule_height_mm:     {value: 0.30, sens: [0.2, 0.4], basis: "ASSUMPTION: no verified OCT protrusion height found; set within the D2 thickness range", status: ASSUMPTION}
  nodule_base_arc_deg:  {value: 60, basis: "ASSUMPTION: nodule protrusion spans 60 deg at the centre of the calcium arc", status: ASSUMPTION}
  fragment_pitch_deg:   {value: 45, basis: "ASSUMPTION: one deposit per 45 deg of arc (n = arc/45, min 2)", status: ASSUMPTION}
  fragment_fill:        {value: 0.6, basis: "ASSUMPTION: each deposit fills 60% of its pitch", status: ASSUMPTION}
  margin_3d_mm:         {value: 2.0, basis: "ASSUMPTION: calcium-free segment length at each end of 3D models", status: ASSUMPTION}

discretisation:
  polar_n_theta: 360              # A-lines (1 deg), IVOCT-like polar map
  polar_dr_mm: 0.01               # 10 um radial sampling
  h_calcium_mm: 0.04              # coarse-mesh defaults (user request); convergence study refines/coarsens
  h_soft_mm: 0.15
  h_axial_3d_mm: 0.25
  example3d:                      # D1 3D code test: coarse for tractability with a direct solver (~64k tets, ~0.3M P2 dofs)
    h_calcium_mm: 0.15
    h_soft_mm: 0.4
    h_axial_mm: 1.0

materials:
  wall:
    model: yeoh
    c10: {lit: wall_yeoh_c10}
    c20: {lit: wall_yeoh_c20}
    c30: {lit: wall_yeoh_c30}
  fibrous:
    model: neo_hookean
    E: {lit: intima_hypocellular_tangential_modulus}
    sens_E: [{lit: intima_cellular_tangential_modulus}, {lit: intima_hypocellular_tangential_modulus, transform: value+sd}]
  lipid:
    model: neo_hookean
    E: {lit: lipid_modulus_AFM}
  calcium:
    model: compressible_neo_hookean
    E: {value: 365.006198, unit: MPa, basis: "CALIBRATED (D8, Checkpoint 2): point 6 of the 9 log-spaced pilot sweep points over sens_E (equality checked by tests/test_params_decisions.py); the stiffest tested modulus at which no pilot lesion fractures under the IVL balloon alone (4 atm) while IVL fractures them. Calibration to a model-internal surrogate, not to a published observation; at this modulus the 10-atm plain balloon still fractures 2 of 3 pilot lesions (cadaver contrast not met). Implied failure stress E*eps_f = 7.30 MPa vs measured tissue-level strength 0.179 MPa.", status: CALIBRATED}
    E_tissue_level: {expr: "calcification_fracture_stress / (calcification_fracture_stretch - 1)", basis: "DERIVED: secant modulus at failure of the same tissue (Holzapfel 2004); the pre-Checkpoint-2 baseline, kept in the sensitivity sweep", status: DERIVED}
    sens_E: [{lit: calcified_tissue_tangential_modulus}, {lit: calcification_modulus_nanoindentation, transform: lower}]
    nu: {lit: calcification_poisson_ratio}
  bulk_to_shear_soft: {value: 50, sens: [20, 200], basis: "ASSUMPTION: near-incompressibility penalty K/mu for soft tissues", status: ASSUMPTION}
  density:              # transient IVL subset only (model-input values from earlier studies; SECONDARY)
    wall:    {lit: density_arterial_wall_model_input, allow_status: [SECONDARY]}
    fibrous: {lit: density_arterial_wall_model_input, allow_status: [SECONDARY]}
    lipid:   {lit: density_plaque_model_input, allow_status: [SECONDARY]}
    calcium: {lit: density_calcified_plaque_model_input, allow_status: [SECONDARY]}
  sound_speed_m_per_s:  # transient IVL subset only
    wall:    {lit: sound_speed_arterial_tissue_37C}
    fibrous: {lit: sound_speed_fibrous_plaque_37C}
    lipid:   {lit: sound_speed_fatty_material}
    calcium: {lit: sound_speed_highly_calcified_lesion_37C}

fracture:
  model: AT1
  split: volumetric_deviatoric
  eps_f: {expr: "calcification_fracture_stretch - 1", basis: "failure stretch 1.02 -> strain 0.02", status: DERIVED}
  sigma_c_stress_controlled: {lit: calcification_fracture_stress}
  ell_over_h: {value: 2.0, sens: [1.5, 3.0], basis: "ASSUMPTION: regularisation length = 2 calcium element sizes", status: ASSUMPTION}
  k_residual: 1.0e-4               # NUMERICAL: residual stiffness of fully damaged calcium; 1e-6 stalled Newton in stent contact (nonlinear module report); sensitivity 1e-5..1e-3
  d_crack: 0.9                    # cell-average d above which a cell is cracked (post-processing)
  crack_filler: {value: matrix, sens: [none], basis: "ASSUMPTION: a fully damaged calcium band keeps the small-strain shear modulus of the fibrous matrix around it (degradation floor k = mu_fibrous/mu_calcium, never below k_residual) instead of becoming a void; Gc is scaled by (1-k) so the AT1 onset criterion is unchanged. Added because brittle crack bands with k_residual alone left near-zero-shear bands between stiff calcium pieces and the displacement Newton solve failed (E_ca >= 121 MPa). 'none' uses k_residual only.", status: ASSUMPTION}

loads:
  physiological_pressure: {lit: normal_systolic_blood_pressure_upper, allow_status: [SECONDARY]}   # 120 mmHg (upper limit of normal systolic), in MPa; SECONDARY-status input under an explicit exception (Checkpoint 2, D15)
  ivl_balloon_pressure_atm: {lit: ivl_balloon_inflation_pressure}
  poba_pressure_atm: {lit: poba_pressure_cadaver_IVL_balloon}            # 10 atm plain balloon (no pulses), pilot comparison protocol, in MPa
  ivl_peak_pressure_MPa: {lit: ivl_peak_positive_pressure}
  ivl_pulse_scale: {value: 1.0, sens: [0.5, 1.0], basis: "ASSUMPTION: unknown attenuation between emitter and tissue", status: ASSUMPTION}
  balloon_rated_pressure_atm: {lit: stent_rated_burst_pressure}        # 16 atm, in MPa
  stent_radial_stiffness_MPa_per_mm: {value: 0.5, basis: "PLACEHOLDER until identified: chosen so that a calcium-free reference lesion shows the clinical acute recoil (lit acute_recoil_EES_CoCr_clinical); the identified value is written to results/calibration_stent.json", status: ASSUMPTION}
  stent_recoil_target_pct: {lit: acute_recoil_EES_CoCr_clinical}
  perivascular_k_MPa_per_mm: {value: 1.0e-4, sens: [1.0e-3, 1.0e-2, 1.0e-1], basis: "ASSUMPTION: negligible support; stabilises rigid-body modes only", status: ASSUMPTION}
  contact_penalty_MPa_per_mm: {value: 1.0e3, basis: "NUMERICAL: penalty stiffness; sensitivity in verification", status: NUMERICAL}
  malapposition_gap_mm: {value: 0.1, sens: [0.05, 0.2], basis: "ASSUMPTION: OCT malapposition distance threshold (not verified)", status: ASSUMPTION}
